<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
  <title id="title">Argus–SPIFFE：先核验，再用身份通信</title>
  <desc id="desc">接入前，由 TDX 与 Argus 核验运行环境和服务，SPIRE 签发短期身份并交付给服务入口。业务通信时，AI 助手与服务入口双向核对身份并加密通信，服务入口关联到已核验的记忆服务实例。</desc>
  <rect x="0" y="0" width="1320" height="650" rx="26" fill="#FFFFFF"/>
  <rect x="40" y="32" width="1240" height="218" rx="28" fill="#F0F8FC"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" fill="#153247">
    <text x="72" y="82" font-size="23" font-weight="600" fill="#0071C5">接入前</text>

    <path d="M 226 114 L 266 132 L 266 164 C 266 193 249 210 226 223 C 203 210 186 193 186 164 L 186 132 Z" fill="#D5EDF9" stroke="#0071C5" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="208,163 221,177 246,150" fill="none" stroke="#0071C5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="292" y="155" font-size="28" font-weight="600">核验环境和服务</text>
    <text x="292" y="194" font-size="23" fill="#426376">TDX + Argus</text>

    <line x1="549" y1="166" x2="674" y2="166" stroke="#0071C5" stroke-width="3"/>
    <polygon points="674,160 686,166 674,172" fill="#0071C5"/>
    <text x="615" y="143" text-anchor="middle" font-size="22" fill="#426376">核验通过</text>

    <rect x="714" y="125" width="84" height="91" rx="13" fill="#FFFFFF" stroke="#0071C5" stroke-width="3"/>
    <rect x="739" y="116" width="34" height="17" rx="6" fill="#0071C5"/>
    <circle cx="742" cy="161" r="10" fill="#A5D7F1"/>
    <path d="M 728 186 C 728 169 756 169 756 186" fill="#A5D7F1"/>
    <line x1="766" y1="153" x2="784" y2="153" stroke="#0071C5" stroke-width="3" stroke-linecap="round"/>
    <line x1="766" y1="168" x2="781" y2="168" stroke="#0071C5" stroke-width="3" stroke-linecap="round"/>
    <line x1="729" y1="200" x2="782" y2="200" stroke="#93BAD0" stroke-width="3" stroke-linecap="round"/>
    <text x="830" y="155" font-size="28" font-weight="600">发放短期身份</text>
    <text x="830" y="194" font-size="23" fill="#426376">SPIRE 签发</text>

    <line x1="756" y1="226" x2="756" y2="354" stroke="#6A9DB9" stroke-width="3" stroke-dasharray="8 7"/>
    <polygon points="750,354 756,367 762,354" fill="#6A9DB9"/>
    <text x="781" y="305" font-size="22" fill="#426376">身份交付给服务入口</text>
    <text x="72" y="335" font-size="23" font-weight="600" fill="#0071C5">开始协作</text>

    <circle cx="180" cy="440" r="62" fill="#E4F3FB"/>
    <rect x="145" y="419" width="70" height="47" rx="15" fill="#FFFFFF" stroke="#0071C5" stroke-width="3"/>
    <line x1="180" y1="419" x2="180" y2="407" stroke="#0071C5" stroke-width="3"/>
    <circle cx="180" cy="403" r="5" fill="#0071C5"/>
    <circle cx="166" cy="439" r="4" fill="#0071C5"/>
    <circle cx="194" cy="439" r="4" fill="#0071C5"/>
    <path d="M 170 451 Q 180 459 190 451" fill="none" stroke="#0071C5" stroke-width="3" stroke-linecap="round"/>
    <text x="180" y="544" text-anchor="middle" font-size="29" font-weight="600">AI 助手</text>

    <text x="465" y="397" text-anchor="middle" font-size="24">双向核对身份，加密通信</text>
    <line x1="272" y1="440" x2="663" y2="440" stroke="#0071C5" stroke-width="4"/>
    <polygon points="272,433 258,440 272,447" fill="#0071C5"/>
    <polygon points="663,433 677,440 663,447" fill="#0071C5"/>

    <circle cx="756" cy="440" r="66" fill="#0071C5"/>
    <path d="M 729 475 L 729 426 C 729 393 783 393 783 426 L 783 475" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 742 475 L 742 426 C 742 409 770 409 770 426 L 770 475" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="763" cy="449" r="3" fill="#FFFFFF"/>
    <line x1="719" y1="475" x2="793" y2="475" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="756" y="544" text-anchor="middle" font-size="29" font-weight="600">服务入口</text>

    <text x="959" y="381" text-anchor="middle" font-size="24">关联到已核验</text>
    <text x="959" y="413" text-anchor="middle" font-size="24">的服务实例</text>
    <line x1="839" y1="440" x2="1064" y2="440" stroke="#0071C5" stroke-width="4"/>
    <polygon points="1064,433 1078,440 1064,447" fill="#0071C5"/>

    <circle cx="1154" cy="440" r="62" fill="#E4F3FB"/>
    <path d="M 1120 418 L 1120 465 C 1120 481 1188 481 1188 465 L 1188 418" fill="#FFFFFF" stroke="#0071C5" stroke-width="3"/>
    <ellipse cx="1154" cy="418" rx="34" ry="12" fill="#FFFFFF" stroke="#0071C5" stroke-width="3"/>
    <path d="M 1120 441 C 1120 457 1188 457 1188 441" fill="none" stroke="#0071C5" stroke-width="3"/>
    <text x="1154" y="544" text-anchor="middle" font-size="29" font-weight="600">记忆服务</text>

    <line x1="72" y1="582" x2="1248" y2="582" stroke="#D8E6EF" stroke-width="1.5"/>
    <text x="660" y="623" text-anchor="middle" font-size="24" fill="#426376">接入前完成核验，业务请求使用已获准的身份。</text>
  </g>
</svg>
