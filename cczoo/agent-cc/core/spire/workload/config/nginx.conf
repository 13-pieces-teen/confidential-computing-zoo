user argus-nginx;
worker_processes 1;
pid /run/argus-nginx/nginx.pid;
error_log stderr info;
worker_shutdown_timeout 5s;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    client_body_temp_path /run/argus-nginx/client_temp;
    proxy_temp_path /run/argus-nginx/proxy_temp;
    server {
        listen 1943 ssl;
        ssl_certificate /run/argus-credentials/current/svid.pem;
        ssl_certificate_key /run/argus-credentials/current/key.pem;
        ssl_client_certificate /run/argus-credentials/current/bundle.pem;
        ssl_verify_client on;
        ssl_verify_depth 5;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache off;
        ssl_session_tickets off;
        ssl_early_data off;
        keepalive_timeout 5s;
        location = /_argus_authz {
            internal;
            proxy_pass http://unix:/run/argus-authz/authz.sock:/authorize;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Argus-TLS-Cert $ssl_client_escaped_cert;
            proxy_set_header X-Argus-TLS-Verified $ssl_client_verify;
        }
        location / {
            auth_request /_argus_authz;
            proxy_pass http://127.0.0.1:1933;
            proxy_set_header X-Argus-TLS-Cert "";
            proxy_set_header X-Argus-TLS-Verified "";
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
