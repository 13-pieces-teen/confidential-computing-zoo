agent_address = "unix:///run/spire/agent/agent.sock"
daemon_mode = true
cert_dir = "/run/argus-credentials"
broker {
    endpoint = "unix:///run/spire/broker/broker.sock"
    helper_spiffe_id = "spiffe://argus.local/infra/openviking-helper"
    agent_spiffe_id = "spiffe://argus.local/spire/agent/argus_tdx/openviking-node"
    target_spiffe_id = "spiffe://argus.local/service/openviking-cmem"
    target_registration_path = "/run/argus-workload/target.json"
    publish_hook = "/opt/argus-workload/bin/nginx-hook.sh"
}
