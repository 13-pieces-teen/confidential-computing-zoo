server {
    bind_address = "127.0.0.1"
    bind_port = 8081
    socket_path = "/tmp/spire-server/private/api.sock"

    trust_domain = "argus.local"
    data_dir = "/var/lib/spire/server"
    log_level = "DEBUG"

    default_x509_svid_ttl = "10m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/keys.json"
        }
    }

    UpstreamAuthority "disk" {
        plugin_data {
            key_file_path = "/var/lib/spire/server/upstream-ca.key"
            cert_file_path = "/var/lib/spire/server/upstream-ca.crt"
        }
    }
}
